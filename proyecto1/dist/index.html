<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGON BALL GAME</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at top, #1b2735 0%, #090a0f 100%);
            color: #f1f1f1;
            min-height: 100vh;
            font-family: "Segoe UI", Roboto, sans-serif;
        }

        h1.display-3 {
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.8), 0 0 25px rgba(255, 102, 0, 0.5);
            letter-spacing: 2px;
        }

        .form-floating input {
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .form-floating input:focus {
            background-color: rgba(255, 255, 255, 0.08);
            color: #fff;
            box-shadow: none;
        }

        #py1, #py2 {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
        }

        #py1 img, #py2 img {
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        #py1 img:hover, #py2 img:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.7);
        }

        #batalla .col-md-5 {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 24px 18px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        }

        #batalla h2 {
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0,0,0,0.6);
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress {
            height: 22px;
            border-radius: 12px;
            background-color: #7a68efb7;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
            margin-bottom: 14px;
        }

        .progress-bar {
            font-size: 0.8rem;
            font-weight: 700;
            line-height: 22px;
            transition: width 0.4s ease-in-out, background-color 0.4s ease;
            border-radius: 12px;
        }

        .progress-bar.bg-success {
            background: linear-gradient(90deg, #28a745, #7bed9f);
        }

        .progress-bar.bg-primary {
            background: linear-gradient(90deg, #0d6efd, #74b9ff);
        }

        .progress-bar.bg-info {
            background: linear-gradient(90deg, #17a2b8, #63e6ff);
        }

        .progress-bar.bg-warning {
            background: linear-gradient(90deg, #ffc107, #ffe066) !important;
            color: #212529;
        }

        .progress-bar.bg-danger {
            background: linear-gradient(90deg, #dc3545, #ff7675) !important;
        }

        #batalla img {
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
        }

        #batalla .btn {
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            transition: transform 0.15s ease;
        }

        #batalla .btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        #batalla .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .badge.bg-dark {
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col text-center">
                <h1 class="text-danger display-3"><i class="fa-solid fa-dragon"></i> DRAGON BALL GAME <i class="fa-solid fa-dragon"></i></h1>
            </div>
        </div>
        <div id="nombres" class="row justify-content-around mt-4">
            <div class="col-md-5">
                <div class="form-floating border border-danger rounded mb-3">
                    <input type="text" id="player1" class="form-control" placeholder="Jugador 1">
                    <label class="text-danger" for="player1"><i class="fa-solid fa-user me-2"></i>Jugador 1</label>
                </div>                
            </div>
            <div class="col-md-5">
                <div class="form-floating border border-primary rounded mb-3">
                    <input type="text" id="player2" class="form-control" placeholder="Jugador 2">
                    <label class="text-primary" for="player2">Jugador 2</label>
                </div>
            </div>
        </div>
        <div class="row justify-content-around mt-3">
            <div id="py1" class="col-md-5 text-center">
                <p class="text-danger">Seleccionar personaje</p>
                <div class="row mt-4">
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border border-danger" src="./public/img/seleccion/sc01.webp" alt="Vegitto">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border border-danger" src="./public/img/seleccion/sc03.webp" alt="Trunks">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border border-danger" src="./public/img/seleccion/sc06.webp" alt="Gohan">                        
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border border-danger" src="./public/img/seleccion/sc05.webp" alt="Goku">
                    </div>
                </div>
                <button id="btn_player1" type="button" class="btn btn-danger w-100 mt-4">Aceptar <i class="fa-solid fa-gamepad"></i></button>
            </div>
            <div id="py2" class="col-md-5">
                <p class="text-danger">Seleccionar personaje</p>
                <div class="row mt-4">
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border border-primary" src="./public/img/seleccion/sc02.webp" alt="Veguetta">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border border-primary" src="./public/img/seleccion/sc08.webp" alt="Cell">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border border-primary" src="./public/img/seleccion/sc04.webp" alt="Pikoro">                        
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border border-primary" src="./public/img/seleccion/sc07.webp" alt="Gogeta">
                    </div>
                </div>
                <button id="btn_player2" type="button" class="btn btn-primary w-100 mt-4">Aceptar <i class="fa-solid fa-gamepad"></i></button>
            </div>
        </div>
    </div>   
    <div id="batalla" class="row justify-content-around mt-4 d-none">
        <!-- PANEL JUGADOR 1 -->
        <div class="col-md-5 text-center">
            <h2 id="username1" class="text-danger"></h2>
            <p id="personaje1" class="lead fs-4"></p>

            <div class="stat-label text-success">
                <span>Vida</span><span id="vida1-txt">100%</span>
            </div>
            <div class="progress">
                <div id="vida1" class="progress-bar bg-success" role="progressbar" 
                style="width: 100%;" aria-valuenow="100" aria-valuemin="0"
                aria-valuemax="100"></div>
            </div>

            <div class="stat-label text-primary">
                <span>Ki</span><span id="ki1-txt">100%</span>
            </div>
            <div class="progress">
                <div id="ki1" class="progress-bar bg-primary" role="progressbar" 
                style="width: 100%;" aria-valuenow="100" aria-valuemin="0"
                aria-valuemax="100"></div>
            </div>

            <div class="stat-label text-info">
                <span>Energía</span><span id="energia1-txt">100%</span>
            </div>
            <div class="progress">
                <div id="energia1" class="progress-bar bg-info" role="progressbar" 
                style="width: 100%;" aria-valuenow="100" aria-valuemin="0"
                aria-valuemax="100"></div>
            </div>

            <img id="img1" src="" class="mx-auto d-block" width="50%">
            <div class="row">
                <div id="btn-py1" class="col">
                    <button type="button" class="btn btn-warning me-2 mb-3">ATK Basico</button>
                    <button type="button" class="btn btn-danger me-2 mb-3">ATK Especial</button>
                    <button type="button" class="btn btn-info me-2 mb-3">Carga KI</button>
                    <button type="button" class="btn btn-success me-2 mb-3">Semilla <span class="badge bg-dark"></span></button>
                </div>
            </div>
        </div>

        <!-- PANEL JUGADOR 2 -->
        <div class="col-md-5 text-center">
            <h2 id="username2" class="text-primary"></h2>
            <p id="personaje2" class="lead fs-4"></p>

            <div class="stat-label text-success">
                <span>Vida</span><span id="vida2-txt">100%</span>
            </div>
            <div class="progress">
                <div id="vida2" class="progress-bar bg-success" role="progressbar" 
                style="width: 100%;" aria-valuenow="100" aria-valuemin="0"
                aria-valuemax="100"></div>
            </div>

            <div class="stat-label text-primary">
                <span>Ki</span><span id="ki2-txt">100%</span>
            </div>
            <div class="progress">
                <div id="ki2" class="progress-bar bg-primary" role="progressbar" 
                style="width: 100%;" aria-valuenow="100" aria-valuemin="0"
                aria-valuemax="100"></div>
            </div>

            <div class="stat-label text-info">
                <span>Energía</span><span id="energia2-txt">100%</span>
            </div>
            <div class="progress">
                <div id="energia2" class="progress-bar bg-info" role="progressbar" 
                style="width: 100%;" aria-valuenow="100" aria-valuemin="0"
                aria-valuemax="100"></div>
            </div>

            <img id="img2" src="" class="mx-auto d-block" width="50%">
            <div class="row">
                <div id="btn-py2" class="col">
                    <button type="button" class="btn btn-warning me-2 mb-3">ATK Basico</button>
                    <button type="button" class="btn btn-danger me-2 mb-3">ATK Especial</button>
                    <button type="button" class="btn btn-info me-2 mb-3">Carga KI</button>
                    <button type="button" class="btn btn-success me-2 mb-3">Semilla <span class="badge bg-dark"></span></button>
                </div>
            </div>
        </div>
    </div>
    <script src="./bundle.js"></script> 
</body>
</html>
